server:
  port: 8082

spring:
  application:
    name: core-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=core_db;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/core_raw_db}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    # lên có ít nhất 2, 3 broker để nếu 1 tk chết sẽ có 1 tk backup
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all           # chờ mọi replica xác nhận, đổi độ trễ lấy độ bền
      properties:
        linger.ms: 20     # gom message nhỏ thành lô trước khi gửi
    consumer:
      group-id: core-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # Mặc định của Kafka là "latest": consumer group mới sẽ bỏ qua toàn bộ message
      # đã nằm sẵn trong topic. Backfill xong mà bảng vẫn trống là do đúng dòng này.
      auto-offset-reset: earliest
      properties:
        # Đọc UsgsFeature khi message không có type header (ví dụ gửi từ Kafka UI).
        # JsonSerializer của KafkaProducerService vẫn có thể dùng type header của nó.
        spring.json.value.default.type: com.earthquake.core.ingestion.dto.UsgsFeature
        spring.json.trusted.packages: com.earthquake.core.ingestion.dto

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:dev-only-local-secret-change-me}

usgs:
  # Backfill lịch sử (truy vấn động)
  fdsn-base-url: "https://earthquake.usgs.gov/fdsnws/event/1/query"

  # Near-realtime (feed tĩnh)
  realtime-feed-url: "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson"
  realtime-enabled: ${USGS_REALTIME_ENABLED:true}   # công tắc tắt poll khi dev/test
  poll-interval-ms: 300000                          # 5 phút (T4)

  # RestTemplate
  connect-timeout-ms: 5000
  read-timeout-ms: 30000                            # query lịch sử nặng hơn feed nhiều
  user-agent: "Ssamachi-EarthquakePlatform/0.1 (learning project)"

  # Tham số nghiệp vụ
  default-min-magnitude: 2.5
  backfill-start-date: "2020-01-01"
  backfill-chunk-days: 30                           # cắt batch theo ~1 tháng (T8)
  max-events-per-query: 20000                       # giới hạn cứng của FDSN, dùng để phát hiện batch bị cắt cụt (T8)
